name: build

permissions:
  contents: read
  actions: write

# CREDIT POLICY (see AGENTS.md): CI runs only when needed and never blocks.
# - Every push / PR: `check` only (one runner, minutes, cached).
# - Binaries (x86_64 + Android, ONE job, sequential): tags `v*` or manual
#   dispatch only. No musl/router target until a router ships (deferred).
# - Concurrency cancels superseded runs so queues never pile up.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets

  # Single release job: x86_64 + Android back-to-back on ONE runner.
  # Runs only on version tags or manual dispatch — never per push.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: build x86_64 release
        run: cargo build --locked --release

      - name: build Android release
        env:
          CC_aarch64_linux_android: aarch64-linux-android34-clang
          AR_aarch64_linux_android: llvm-ar
        run: |
          cargo build --locked --release --target aarch64-linux-android \
            --config 'target.aarch64-linux-android.linker="aarch64-linux-android34-clang"'

      - name: sizes
        run: |
          ls -la target/release/native-searxng target/aarch64-linux-android/release/native-searxng
          du -h target/release/native-searxng target/aarch64-linux-android/release/native-searxng

      - name: smoke test (contract keys + live wikipedia, x86_64 binary)
        run: |
          ./target/release/native-searxng & SRV=$!
          sleep 1
          curl -sf 127.0.0.1:8888/healthz
          curl -sf '127.0.0.1:8888/search?q=test&format=json&engines=wikipedia' -o /tmp/nq.json
          python3 -c 'import json; d=json.load(open("/tmp/nq.json")); assert set(d) == {"query","results","answers","corrections","infoboxes","suggestions","unresponsive_engines"}, sorted(d); assert d["results"], "empty results"; print("smoke OK:", len(d["results"]), "results")'
          kill $SRV

      - uses: actions/upload-artifact@v4
        with:
          name: native-searxng-x86_64-android
          path: |
            target/release/native-searxng
            target/aarch64-linux-android/release/native-searxng
