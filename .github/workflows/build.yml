name: build

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets

  release-x86_64:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release
      - run: ls -la target/release/native-searxng && du -h target/release/native-searxng
      - name: smoke test (contract keys + live wikipedia)
        run: |
          ./target/release/native-searxng & SRV=$!
          sleep 1
          curl -sf 127.0.0.1:8888/healthz
          curl -sf '127.0.0.1:8888/search?q=test&format=json&engines=wikipedia' -o /tmp/nq.json
          python3 -c 'import json; d=json.load(open("/tmp/nq.json")); assert set(d) == {"query","results","answers","corrections","infoboxes","suggestions","unresponsive_engines"}, sorted(d); assert d["results"], "empty results"; print("smoke OK:", len(d["results"]), "results")'
          kill $SRV
      - uses: actions/upload-artifact@v4
        with:
          name: native-searxng-x86_64
          path: target/release/native-searxng

  release-aarch64-musl:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -q && sudo apt-get install -qy musl-tools
      - run: cargo build --locked --release --target aarch64-unknown-linux-musl
      - run: ls -la target/aarch64-unknown-linux-musl/release/native-searxng && du -h target/aarch64-unknown-linux-musl/release/native-searxng
      - uses: actions/upload-artifact@v4
        with:
          name: native-searxng-aarch64-musl
          path: target/aarch64-unknown-linux-musl/release/native-searxng

  release-aarch64-android:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
      - run: |
          cargo build --locked --release --target aarch64-linux-android \
            --config 'target.aarch64-linux-android.linker="aarch64-linux-android34-clang"'
      - run: ls -la target/aarch64-linux-android/release/native-searxng && du -h target/aarch64-linux-android/release/native-searxng
      - uses: actions/upload-artifact@v4
        with:
          name: native-searxng-aarch64-android
          path: target/aarch64-linux-android/release/native-searxng
