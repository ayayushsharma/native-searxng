port=8888
bind=127.0.0.1
engines=wikipedia,ddg,openlibrary,mwmbl,grokipedia,startpagina,boardreader,chatnoir,dogpile,gmx,stackoverflow,superuser,askubuntu,github,mdn,dockerhub,gentoo,arxiv,europepmc,openalex,bingnews,wikinews,pubmed,ddgnews,npm,crates
timeout_ms=3000
proxy_timeout_ms=30000
body_cap_kb=96
max_results=20
lang=en
user_agent=Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36
# Keyed services: API keys come ONLY from the environment, never this file.
# Convention: SEARXNG_API_KEY_<ENGINE> (uppercased). Unset/blank = dormant.
#   SEARXNG_API_KEY_JINA   /fetch extraction (optional — free tier works keyless)
#   SEARXNG_API_KEY_BRAVE  future braveapi slot (parked — needs a key in hand)
# Strangler fallback: unknown categories/engines proxy here (Python ref).
# Empty = disabled (503 for unknown instead).
proxy_to=http://127.0.0.1:8889
