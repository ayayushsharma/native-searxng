# native-searxng — SearXNG-compatible metasearch core (native Rust).
#
# Sections: [server] identity + auth switch, [http] fetch budgets,
# [proxy] strangler fallback, [engines] who answers (merge order =
# file order: earlier engines win ties in the round-robin merge).
#
# Secrets NEVER live here. Conventions (env-only, unset = dormant):
#   SEARXNG_API_TOKEN      bearer for the HTTP gate (comma-separated,
#                          rotation without downtime)
#   SEARXNG_API_KEY_JINA   /fetch extraction (optional — keyless works)
#   SEARXNG_API_KEY_<ENGINE>  uppercased engine name, same rule

[server]
port = 8888
bind = "127.0.0.1"      # loopback: cloudflared tunnel is the sole client

# Kill-switch for local dev ONLY. Default true (fail closed: main
# refuses to start with no token). `false` runs open WITHOUT a token —
# greppable, never the default, never for a tunnelled host.
require_auth = true

[http]
timeout_ms = 3000       # per-engine fetch deadline (honest 503 past it)
proxy_timeout_ms = 30000 # strangler proxy: full oracle fan-out needs room
body_cap_kb = 96        # per-fetch buffer (fat JSON overrides per engine)
language = "en"
user_agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36"

# Custom CA bundle for TLS-intercepting networks (work machines with a
# corporate proxy): set this to your corp CA's PEM file and the server
# trusts ONLY it instead of Mozilla's bundled roots (the proxy re-signs
# everything, so its CA is the only root needed). Empty = bundled roots.
# A missing/unparseable file refuses to start — never silent fallback.
# ca_file = "/path/to/corp-ca.pem"

[proxy]
# Strangler fallback: unknown categories/engines proxy to the Python
# reference here. Empty string disables (503 for unknown instead).
url = "http://127.0.0.1:8889"

# Fan-out lanes: 0 = auto = min(cpu count, 4, engines), safe on every
# host (today's behavior). Beefy machines: 64 (one engine per lane,
# fully parallel, +RSS per lane). Small machines: 1-2 (sequential-ish,
# minimal arenas, slower worst case). Clamped to [1, engines] at use.
[perf]
lanes = 0

# Verbosity: off | error | warn | info | debug (default info).
#   info  = one line per request + every failed engine with its reason
#   warn  = failures only (quiet serving)
#   debug = per-engine legs, upstream URLs, MCP calls (noisy)
# Logs go to stderr — MCP stdio (stdout) is never touched.
[logging]
level = "info"

[engines]
# Merge groups by category, file order = merge weight. (2026-10-16
# regroup: flat searxng.conf interleaved pubmed/ddgnews among news by
# porting order; pubmed now closes science, ddgnews closes news.)
# Merge groups by category, file order = merge weight. Order is DATA:
# weights v1 (2026-10-16, quality 36q): score = overlap-hits -
# 2*unresponsive, ties keep previous order. Re-run weights.py on a fresh
# quality.log to revise; single 429-waves can demote good engines.
general = [
  "dogpile", "swisscows", "startpagina", "keenable", "mwmbl",
  "bpb", "boardreader", "grokipedia", "openlibrary", "wikipedia",
  "chatnoir", "neosearch", "gmx", "ddg",
]
it = [
  "mdn", "github", "dockerhub", "hackernews", "datatracker",
  "nvd", "archlinux", "gentoo", "cheatsh", "pipdocs",
  "flask", "microsoftlearn", "askubuntu", "superuser", "stackoverflow",
]
science = [
  "europepmc", "arxiv", "crossref", "openalex", "pubmed",
]
news = [
  "bingnews", "wikinews", "yahoo_news", "swisscows_news", "tagesschau", "ddgnews",
]
packages = [
  "crates", "pubdev", "pkggodev", "npm", "packagist",
  "hexpm", "terraform", "artifacthub", "nuget", "rubygems",
  "maven",
]
videos = ["sepiasearch"]
dictionaries = ["jisho"]
weather = ["open_meteo"]
